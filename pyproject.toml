[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sedcoretool"
version = "0.123.0"
description = "SedCoreTool (formerly CorAnTool and IchAnTool): quantitative ichnofabric analysis of sediment core images"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Santiago Casanova-Arenillas" }]
requires-python = ">=3.10"
keywords = ["ichnology", "bioturbation", "ichnofabric", "core", "image analysis", "sedimentology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = ["numpy>=1.24", "pillow>=10", "pandas>=2.0"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
plot = ["matplotlib>=3.7"]
unet = ["onnxruntime>=1.17", "torch>=2.1", "segmentation-models-pytorch>=0.3", "onnx>=1.15"]
dev = ["pytest>=7", "pytest-cov>=5", "openpyxl>=3.1", "matplotlib>=3.7"]

[project.scripts]
sedcoretool = "sedcoretool.cli:main"
ichantool = "sedcoretool.cli:main"   # old command name, kept for compatibility

[project.urls]
Homepage = "https://github.com/SantiCa/SedCoreTool"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E731", "E702", "E741", "B905"]
