<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CorAnTool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Quantitative ichnofabric analysis of sediment core images: enhancement, trace detection, learned ichnotaxon identification, bioturbation percentage, BI and ii.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: core-logging workstation. Left = workflow steps; centre = core image with depth ruler and a
   log strip drawn at the same depth scale; right = ichnotaxa, learning and results. */
:root {
  --bg: #e9ecea; --panel: #f7f8f7; --ink: #1c2422; --muted: #5b6763; --line: #d0d7d4; --field: #ffffff;
  --accent: #a85f1c; --accent-ink: #ffffff; --accent-soft: #f2e2d1; --focus: #2f6fb0;
  --viewer: #161a19; --viewer-ink: #e6e1d6; --danger: #b3261e; --ok: #2e7d4f;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101413; --panel: #171c1b; --ink: #e2e7e5; --muted: #95a39e; --line: #2a3331; --field: #0f1312;
    --accent: #e0995a; --accent-ink: #1a1208; --accent-soft: #3a2a1b; --focus: #7fb2e5;
    --viewer: #0c0f0e; --viewer-ink: #e6e1d6; --danger: #ff8a80; --ok: #7bd6a0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101413; --panel: #171c1b; --ink: #e2e7e5; --muted: #95a39e; --line: #2a3331; --field: #0f1312;
  --accent: #e0995a; --accent-ink: #1a1208; --accent-soft: #3a2a1b; --focus: #7fb2e5;
  --viewer: #0c0f0e; --viewer-ink: #e6e1d6; --danger: #ff8a80; --ok: #7bd6a0; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font-body); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* top bar */
.top { display: flex; align-items: center; gap: 16px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 600 18px/1 var(--font-head); letter-spacing: .02em; }
.brand b i { font-style: normal; color: var(--accent); }
.brand span { color: var(--muted); font-size: 12px; }
.top .grow { flex: 1; }
.top .acts { display: flex; gap: 6px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--field); border-radius: var(--r); padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
label.file { display: inline-flex; }
label.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* main grid */
.work { min-height: 0; display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; }
.side { min-height: 0; overflow: auto; background: var(--panel); }
.side.left { border-right: 1px solid var(--line); }
.side.right { border-left: 1px solid var(--line); display: flex; flex-direction: column; }

.step { border-bottom: 1px solid var(--line); }
.step > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 14px; font: 600 12px/1 var(--font-head); text-transform: uppercase; letter-spacing: .07em; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 600 11px/1 var(--font-data); letter-spacing: 0; }
.step > summary::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
.step[open] > summary::after { transform: rotate(-135deg); }
.step .body { padding: 2px 14px 14px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
/* V19.1: nothing in the side panels may be wider than the panel (long labels wrap instead of being cut) */
.side { overflow-x: hidden; }
.side .body > *, .side .f, .side .grid2 > *, .side .slider > * { min-width: 0; }
.side .btn { white-space: normal; text-align: center; max-width: 100%; line-height: 1.25; }
.side select { max-width: 100%; text-overflow: ellipsis; }
.side .note, .side .chk span { overflow-wrap: anywhere; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > * { min-width: 0; }
.f { display: grid; gap: 3px; }
.f > span, .lbl { color: var(--muted); font-size: 11.5px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 70px; gap: 8px; }
input[type=text], input[type=number], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: var(--r); padding: 5px 7px; }
textarea { font: 12px/1.4 var(--font-data); resize: vertical; min-height: 64px; }
input[type=number] { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 11.5px; margin: 0; }
.chk { display: flex; gap: 7px; align-items: flex-start; cursor: pointer; }
.chk input { margin-top: 2px; accent-color: var(--accent); }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.slider span { color: var(--muted); font-size: 11.5px; }
.slider output { font: 11.5px var(--font-data); font-variant-numeric: tabular-nums; color: var(--ink); }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
.status-line { font: 12px var(--font-data); color: var(--ok); min-height: 1.4em; margin: 0; }

/* stage */
.stage { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr auto; background: var(--viewer); }
.tools { display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tool { width: 32px; height: 30px; display: grid; place-items: center; border: 1px solid transparent; border-radius: var(--r); background: transparent; cursor: pointer; color: var(--ink); }
.tool:hover { border-color: var(--line); }
.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
.opt { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.opt input[type=range] { width: 90px; accent-color: var(--accent); }
.opt output { font: 12px var(--font-data); color: var(--ink); min-width: 2.5em; }
.zoom { font: 12px var(--font-data); color: var(--muted); min-width: 4em; text-align: right; }
.viewport { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 230px; }
#view { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#view.pan { cursor: grab; }
#profile { width: 100%; height: 100%; display: block; border-left: 1px solid #2c3331; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--viewer-ink); pointer-events: none; }
.empty > div { pointer-events: auto; max-width: 380px; text-align: center; display: grid; gap: 10px; justify-items: center; padding: 24px; border: 1.5px dashed #4a5250; border-radius: 10px; }
.empty h2 { margin: 0; font: 600 18px var(--font-head); }
.empty p { margin: 0; color: #b5aea2; }
.drop .empty > div { border-color: var(--accent); }
.statusbar { display: flex; gap: 18px; padding: 4px 12px; font: 11.5px var(--font-data); color: #b5aea2; background: #111413; border-top: 1px solid #262c2b; white-space: nowrap; overflow: hidden; }
.busy { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 5px 14px; border-radius: 99px; font-weight: 600; z-index: 3; }

/* right panel */
.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.tabs button { flex: 1 1 auto; border: 0; background: transparent; padding: 10px 6px; cursor: pointer; font: 600 11px var(--font-head); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { padding: 12px 14px; display: grid; gap: 12px; align-content: start; overflow: auto; min-height: 0; flex: 1; }

.clist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.clist li { display: grid; grid-template-columns: 18px 22px minmax(0, 1fr) auto 18px; gap: 6px; align-items: center; padding: 4px 6px; border-radius: var(--r); border: 1px solid transparent; cursor: pointer; }
.clist li:hover { background: var(--bg); }
.clist li.active { border-color: var(--accent); background: var(--accent-soft); }
.clist kbd { font: 11px var(--font-data); color: var(--muted); text-align: center; }
.clist input[type=color] { width: 22px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
.clist input.name { border: 0; background: transparent; padding: 2px 3px; font-style: italic; }
.clist li.plain input.name { font-style: normal; }
.clist input.name:focus { background: var(--field); }
.clist .cnt { font: 11px var(--font-data); color: var(--muted); white-space: nowrap; }
.clist .del { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 15px; line-height: 1; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font: 600 11px var(--font-body); }
.pill.labeled { background: var(--accent-soft); color: var(--accent); }
.pill.predicted { border: 1px dashed var(--accent); color: var(--accent); }
.pill.candidate { background: var(--bg); color: var(--muted); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat div { background: var(--bg); border-radius: var(--r); padding: 8px; display: grid; gap: 2px; }
.stat b { font: 600 18px var(--font-data); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 11px; line-height: 1.25; }
.bars { display: grid; gap: 5px; }
.bars div { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-size: 12px; }
.bars i { display: block; height: 6px; border-radius: 3px; margin-top: 3px; }
.bars em { font: 11.5px var(--font-data); text-align: right; font-style: normal; }
.tablewrap { overflow: auto; max-height: 340px; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font: 11.5px var(--font-data); font-variant-numeric: tabular-nums; }
th, td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--panel); font: 600 11px var(--font-body); color: var(--muted); }
td select { width: auto; padding: 0 2px; font: 11.5px var(--font-data); border-radius: 3px; }
.exp { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); max-width: min(620px, calc(100vw - 32px)); padding: 20px 22px; }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog h2 { margin: 0 0 8px; font: 600 18px var(--font-head); }
dialog ol { padding-left: 20px; display: grid; gap: 6px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: var(--r); z-index: 10; max-width: calc(100vw - 32px); }

/* modes, projects, composite log */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--field); padding: 5px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.proj { display: inline-flex; gap: 6px; align-items: baseline; max-width: 340px; }
.btn.proj b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.btn.proj .lbl { color: var(--muted); font-size: 11.5px; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.savestate { font-size: 11.5px; color: var(--muted); align-self: center; min-width: 7em; }
.savestate[data-state="saved"] { color: var(--ok); }
.savestate[data-state="error"], .savestate[data-state="off"] { color: var(--danger); }
.plist { max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); }
.prow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.prow:last-child { border-bottom: 0; }
.prow.current { background: var(--accent-soft); }
.pinfo { display: grid; min-width: 0; }
.reccols { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px; max-height: 30vh; overflow: auto; }
.rec { border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: grid; gap: 4px; }
.rec .srow { flex-wrap: nowrap; justify-content: space-between; }
.rec .srow .chk { min-width: 0; }
.rec .srow input[type=color] { width: 22px; height: 20px; padding: 0; border: 1px solid var(--line); border-radius: 4px; }
#logPanel, #logStage { display: none; }
.work.log { grid-template-columns: 300px minmax(0, 1fr); }
.work.log > .side, .work.log > .stage { display: none; }
.work.log > #logPanel { display: block; border-right: 1px solid var(--line); }
.work.log > #logStage { display: block; min-width: 0; min-height: 0; overflow: auto; padding: 16px; }
#logPanel .body { grid-template-columns: minmax(0, 1fr); }
#logPanel .body > *, .rec, .rec .srow > * { min-width: 0; }
.rec .srow .chk { overflow: hidden; }
.rec .srow .chk span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rec .srow .chk.note { flex: none; }
#logSvg { display: inline-block; background: #ffffff; border: 1px solid var(--line); border-radius: var(--r); }
#logSvg svg { display: block; }
#geoPanel, #geoStage { display: none; }
.work.geo { grid-template-columns: 320px minmax(0, 1fr); }
.work.geo > .side, .work.geo > .stage, .work.geo > #logStage { display: none; }
.work.geo > #geoPanel { display: block; border-right: 1px solid var(--line); overflow: auto; }
.work.geo > #geoStage { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
#geoStage .gpane { flex: 1; overflow: auto; padding: 14px 16px; min-height: 0; }
#geoStage .gctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin-bottom: 10px; }
#geoStage .gctl .f { min-width: 90px; }
.tipcard { position: fixed; left: 16px; bottom: 16px; z-index: 40; max-width: 380px; background: #fff8d6; color: #3a3320; border: 1px solid #e3cf7a; border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.tipcard[hidden] { display: none; }
#tour { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
#tour[hidden] { display: none; }
#tour .tourhl { position: fixed; border: 3px solid #f2b705; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(10,14,13,.55); transition: all .2s; pointer-events: none; }
#tour .tourbox { position: fixed; pointer-events: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
#tour .tourbox h3 { margin: 0; font-size: 15px; } #tour .tourn { font-size: 11px; color: var(--muted); }
dialog.wide { max-width: min(1100px, calc(100vw - 32px)); width: 100%; }
#mlTabs { display: flex; gap: 6px; margin: 10px 0; }
#mlTabs .btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.mlbody { max-height: 72vh; overflow: auto; display: grid; gap: 8px; align-content: start; }
.mlbody h3 { margin: 10px 0 2px; font-size: 14px; }
.mlbody table.gtab td, .mlbody table.gtab th { padding: 3px 6px; vertical-align: top; text-align: left; }
.mlmethods { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.mlm { display: grid; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; }
.mlm.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.mlgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.mlx { margin: 0; border: 1px solid var(--line); border-radius: 6px; padding: 4px; display: grid; gap: 2px; background: var(--field); }
.mlx.off { opacity: .45; }
.mlx img { width: 100%; height: 72px; object-fit: contain; background: #000; border-radius: 4px; cursor: pointer; }
.mlx .noimg { height: 72px; display: grid; place-items: center; font-size: 11px; color: var(--muted); }
.mlx figcaption { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mlx .row { gap: 4px; } .mlx .chk { font-size: 11px; }
.clfscope { display: grid; gap: 6px; margin-bottom: 8px; }
.mtab { font-size: 12px; width: 100%; }
.mtab th, .mtab td { padding: 2px 5px; }
.mtab .on { background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
.mapstyle details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 0 0 8px; }
.mapstyle summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.mapstyle .msgrid { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin-top: 8px; }
.mapstyle .msgrid .f { min-width: 0; }
.mapstyle input[type=color] { width: 38px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
.mapstyle input[type=number] { width: 76px; }
.mapstyle .zbtn { display: flex; gap: 4px; align-items: center; }
.clist { display: flex; flex-wrap: wrap; gap: 4px 14px; max-height: 160px; overflow: auto; }
.mapstyle[hidden] { display: none; }
.zmap { position: relative; touch-action: none; }
.zmap svg { cursor: grab; display: block; max-width: 100%; height: auto; }
.zmap.dragging svg { cursor: grabbing; }
#geoLogSvg, #geoMapSvg { display: inline-block; background: #ffffff; border: 1px solid var(--line); border-radius: var(--r); max-width: 100%; }
#geoLogSvg svg { display: block; }
#geoMapSvg { display: block; width: 100%; }
#geoMapSvg svg { display: block; width: 100%; max-width: 100%; height: auto; }
.work.geo.mapwide { grid-template-columns: minmax(0, 1fr); }
.work.geo.mapwide > #geoPanel { display: none; }
#geoMapSvg:fullscreen { background: #fff; overflow: auto; display: grid; place-items: center; }
#geoMapSvg:fullscreen svg { width: auto; height: 100vh; max-width: 100vw; }
#gmBig[aria-pressed="true"] { background: var(--accent); color: #fff; }
.glogwrap { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.glogside { flex: 1; min-width: 220px; display: grid; gap: 6px; }
.ivrow { flex-wrap: nowrap; gap: 6px; font-size: 12px; }
.ivrow .note { flex: 1; }
.ivrow select { min-width: 0; flex: 1; }
.ivrow input[type=number] { width: 74px; }
.ivrow.auto { opacity: .7; font-style: italic; }
.ivhead { margin-top: 6px; font-size: 12.5px; }
.warn { color: var(--danger); cursor: help; }
.glogside { max-width: 520px; }
.gcore { border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; display: grid; gap: 4px; cursor: pointer; }
.gcore.current { border-color: var(--accent); background: var(--accent-soft); }
.gcores { display: grid; gap: 6px; max-height: 32vh; overflow: auto; }
.gparams { display: grid; gap: 4px; }
.gparams .note { margin: -2px 0 6px; }
#geoPanel .body > *, .rule .row > * { min-width: 0; }
.rule .cond input { width: 70px; }
#geoModelOut { display: grid; gap: 10px; max-width: 760px; }
#geoModelOut h3 { margin: 6px 0 0; font: 600 14px var(--font-head); }
#geoModelOut table { border-collapse: collapse; font-size: 12px; }
#geoModelOut th, #geoModelOut td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; }
#geoModelOut th:first-child { text-align: left; }
#geoLogSvg.marking { cursor: crosshair; }
.gimp .reccols { max-height: 26vh; }
dialog input[type=text] { min-width: 0; }
.corebar { display: flex; align-items: center; gap: 4px; }
.corebar .lbl, .proj .lbl { color: var(--muted); font-size: 12px; }
.corebar select { max-width: 220px; }
#dataView { display: none; }
#figPanel, #figStage { display: none; }
.work.fig { grid-template-columns: 330px minmax(0, 1fr); }
.work.fig > * { display: none !important; }
.work.fig > #figPanel { display: block !important; border-right: 1px solid var(--line); overflow: auto; }
.work.fig > #figStage { display: block !important; overflow: auto; padding: 16px; min-width: 0; }
#figOut { display: inline-block; background: #fff; border: 1px solid var(--line); border-radius: var(--r); }
#figOut svg { display: block; max-width: 100%; height: auto; }
.figcls { border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: grid; gap: 6px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 4px; max-height: 220px; overflow: auto; }
.thumbs label { position: relative; cursor: pointer; }
.thumbs canvas { display: block; border: 2px solid transparent; border-radius: 4px; background: #000; }
.thumbs input { position: absolute; left: 3px; top: 3px; }
.thumbs input:checked + canvas { border-color: var(--accent); }
.work.data { grid-template-columns: minmax(0, 1fr); }
.work.data > * { display: none !important; }
.work.data > #dataView { display: flex !important; flex-direction: column; min-height: 0; overflow: hidden; }
#dataView .dctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; padding: 10px 16px; border-bottom: 1px solid var(--line); }
#dataView .dbody { flex: 1; overflow: auto; padding: 10px 16px; min-height: 0; }
.dtable { border-collapse: collapse; font: 12px var(--font-data); }
.dtable th, .dtable td { border: 1px solid var(--line); padding: 2px 6px; text-align: right; white-space: nowrap; }
.dtable thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
.dtable th .tag { display: block; font: 600 10px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.dtable th.imp .tag { color: #3b7dd8; } .dtable th.img .tag, .dtable th.man .tag { color: #2e7d4f; } .dtable th.calc .tag { color: #b8742a; } .dtable th.rec .tag { color: #7a4fb2; } .dtable th.lay .tag { color: #8e44ad; }
.dtable td[contenteditable] { background: var(--accent-soft); }
.dtable td.txt { text-align: left; }
.cells td { min-width: 90px; text-align: left; } .cells td input { width: 100%; border: 0; background: transparent; font: inherit; color: var(--ink); }
.cells td.err { color: var(--danger); }
.colrow { display: grid; grid-template-columns: 160px minmax(0, 1fr) 140px auto; gap: 6px; align-items: center; }
#home { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow: auto; padding: 20px max(16px, 3vw); }
#home[hidden] { display: none; }
#home .hgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; max-width: 1500px; margin: 0 auto; }
#home .htabs { display: flex; gap: 6px; max-width: 1500px; margin: 0 auto 12px; }
#home .htabs .btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
#home .mpbox { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 6px; }
#home .mpbox h3 { margin: 0; font-size: 14px; }
#home section.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
#home h1 { font: 600 22px var(--font-head); margin: 0 auto 12px; max-width: 1500px; }
#home h2 { font: 600 15px var(--font-head); margin: 0; }
#allMap svg { width: 100%; height: auto; display: block; background: #fff; border-radius: var(--r); }
.float { position: fixed; right: 16px; bottom: 16px; width: 520px; height: 420px; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 8px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; resize: both; overflow: hidden; min-width: 280px; min-height: 200px; }
.float header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: move; border-bottom: 1px solid var(--line); font: 600 13px var(--font-head); }
.float .fbody { flex: 1; overflow: auto; background: #fff; }
.float .fbody svg { width: 100%; height: auto; display: block; }
body.viewonly .top .seg, body.viewonly .corebar, body.viewonly #projBtn { display: none; }
@media (max-width: 860px) { #home .hgrid { grid-template-columns: minmax(0, 1fr); } .colrow { grid-template-columns: minmax(0, 1fr); } }
.bk { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.bk h3 { margin: 0; font: 600 14px var(--font-head); }
.bkstatus { margin: 0; font-weight: 600; }
.bkstatus[data-state="ok"] { color: var(--ok); }
.bkstatus[data-state="needs"], .bkstatus[data-state="error"], .bkstatus[data-state="none"] { color: var(--danger); }

@media (max-width: 1100px) { .work { grid-template-columns: 250px minmax(0, 1fr) 280px; } .viewport { grid-template-columns: minmax(0, 1fr) 180px; } }
@media (max-width: 860px) {
  .app { height: auto; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 78vh; order: -1; }
  .side.left { border-right: 0; }
  .side.right { border-left: 0; border-top: 1px solid var(--line); }
  .viewport { grid-template-columns: minmax(0, 1fr) 130px; }
  .work.log { grid-template-columns: minmax(0, 1fr); }
  .work.log > #logStage { order: -1; max-height: 80vh; }
  .work.geo { grid-template-columns: minmax(0, 1fr); }
  .work.geo > #geoStage { order: -1; max-height: 85vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" title="CorAnTool (antes IchAnTool)"><b>Cor<i>An</i>Tool</b></div>
    <button class="btn proj" id="projBtn" data-i18n-title="home.title"><span aria-hidden="true">⌂</span><span class="lbl" data-i18n="proj.label"></span><b id="projName"></b></button>
    <div class="corebar"><span class="lbl" data-i18n="core.label"></span><select id="coreSel"></select><button class="btn small" id="coreAdd" data-i18n-title="core.add">+</button><button class="btn small ghost" id="coreEdit" data-i18n-title="core.edit">✎</button></div>
    <div class="seg" role="group"><button id="modeSection" aria-pressed="true" data-i18n="mode.section"></button><button id="modeLog" aria-pressed="false" data-i18n="mode.log"></button><button id="modeData" aria-pressed="false" data-i18n="mode.data"></button><button id="modeGeo" aria-pressed="false" data-i18n="mode.geo"></button><button id="modeFig" aria-pressed="false" data-i18n="mode.fig"></button></div>
    <div class="grow"></div>
    <div class="acts">
      <span class="savestate" id="saveState"></span>
      <button class="btn small danger" id="bkReactivateTop" hidden data-i18n="bk.reactivate"></button>
      <button class="btn ghost" id="helpBtn" data-i18n="top.help"></button>
      <button class="btn ghost" id="themeBtn" data-i18n-title="top.theme">☾</button>
      <button class="btn ghost" id="langBtn">EN</button>
    </div>
  </header>

  <div class="work" id="work">
    <aside class="side left">
      <details class="step" open>
        <summary><span class="n">1</span><span data-i18n="s1"></span></summary>
        <div class="body">
          <label class="btn primary file" style="justify-content:center"><span data-i18n="sec.add"></span><input type="file" id="addImg" accept="image/*,.tif,.tiff" multiple></label>
          <label class="f"><span data-i18n="sec.maxMP"></span><select id="maxMP"><option value="2">2 MP</option><option value="4">4 MP</option><option value="8">8 MP</option><option value="16">16 MP</option><option value="1000" data-i18n="mp.orig"></option></select></label>
          <p class="note" data-i18n="sec.maxMPNote"></p>
          <div class="f"><span data-i18n="sec.section"></span>
            <div class="row" style="flex-wrap:nowrap"><select id="secSel"></select><button class="btn small" id="secDel" data-i18n-title="sec.delete">✕</button></div>
          </div>
          <label class="f"><span data-i18n="sec.name"></span><input type="text" id="secName"></label>
          <div class="grid3">
            <label class="f"><span data-i18n="sec.top"></span><input type="number" id="secTop" step="any"></label>
            <label class="f"><span data-i18n="sec.bottom"></span><input type="number" id="secBottom" step="any"></label>
            <label class="f"><span data-i18n="sec.units"></span><select id="secUnits"><option>mm</option><option>cm</option><option>m</option></select></label>
          </div>
          <p class="note" data-i18n="sec.depthNote"></p>
          <div class="f"><span data-i18n="roi.title"></span>
            <div class="row"><button class="btn small" id="roiBtn" data-i18n="roi.draw"></button><button class="btn small" id="roiReset" data-i18n="roi.reset"></button>
              <button class="btn small" id="rotL" data-i18n-title="sec.rotate">⟲</button><button class="btn small" id="rotR" data-i18n-title="sec.rotate">⟳</button></div>
            <p class="note" id="roiInfo"></p>
          </div>
          <div class="f"><span data-i18n="age.title"></span>
            <textarea id="ageText" data-i18n-ph="age.ph" rows="3"></textarea>
            <div class="row"><label class="btn small file"><span data-i18n="age.file"></span><input type="file" id="ageFile" accept=".csv,.txt,text/csv,text/plain"></label>
              <select id="ageUnits" style="width:auto"><option value="ka">ka</option><option value="yr BP">yr BP</option><option value="Ma">Ma</option></select></div>
            <p class="note" id="ageStatus"></p>
          </div>
        </div>
      </details>
      <details class="step" open>
        <summary><span class="n">2</span><span data-i18n="s2"></span></summary>
        <div class="body">
          <label class="f"><span data-i18n="f.preset"></span><select id="fPreset"></select></label>
          <p class="note" id="presetNote"></p>
          <div class="row" style="flex-wrap:nowrap"><input type="text" id="presetName" data-i18n-ph="f.saveName"><button class="btn small" id="presetSave" data-i18n="f.save"></button><button class="btn small ghost" id="presetDel" data-i18n-title="f.del">✕</button></div>
          <button class="btn small" id="presetAll" data-i18n="f.applyAll"></button>
          <button class="btn small" id="presetBest" data-i18n="f.best"></button>
          <p class="note" id="presetRank"></p>
          <label class="chk"><input type="checkbox" id="fAuto"><span data-i18n="f.auto"></span></label>
          <label class="chk"><input type="checkbox" id="fAutoG"><span data-i18n="f.autoG"></span></label>
          <label class="f"><span data-i18n="f.channel"></span><select id="fChannel"></select></label>
          <div id="filterCtl" style="display:grid;gap:8px"></div>
          <label class="chk"><input type="checkbox" id="fEqualize"><span data-i18n="f.equalize"></span></label>
          <label class="chk"><input type="checkbox" id="fInvert"><span data-i18n="f.invert"></span></label>
        </div>
      </details>
      <details class="step" open>
        <summary><span class="n">3</span><span data-i18n="s3"></span></summary>
        <div class="body">
          <label class="f"><span data-i18n="d.method"></span><select id="dMethod"><option value="adaptive" data-i18n="d.adaptive"></option><option value="global" data-i18n="d.global"></option><option value="kmeans" data-i18n="d.kmeans"></option></select></label>
          <label class="f"><span data-i18n="d.polarity"></span><select id="dPol"><option value="dark" data-i18n="d.dark"></option><option value="light" data-i18n="d.light"></option><option value="both" data-i18n="d.both"></option></select></label>
          <div id="detectCtl" style="display:grid;gap:8px"></div>
          <label class="chk"><input type="checkbox" id="dFill"><span data-i18n="d.fill"></span></label>
          <div class="row"><button class="btn primary" id="detectBtn" data-i18n="d.run"></button><button class="btn" id="clearCand" data-i18n="d.clear"></button></div>
          <p class="status-line" id="detectStatus"></p>
          <p class="note" data-i18n="d.note"></p>
        </div>
      </details>
      <details class="step" open>
        <summary><span class="n">4</span><span data-i18n="s4"></span></summary>
        <div class="body">
          <div class="slider"><span data-i18n="a.bin"></span><output id="binOut"></output><input type="range" id="binPx" min="1" max="500" step="1"></div>
          <p class="note" id="binNote"></p>
          <label class="chk"><input type="checkbox" id="inclPred"><span data-i18n="a.inclPred"></span></label>
          <label class="chk"><input type="checkbox" id="countCand"><span data-i18n="a.countCand"></span></label>
          <p class="note" data-i18n="a.note"></p>
        </div>
      </details>
    </aside>

    <section class="stage">
      <div class="tools" id="tools">
        <button class="tool" data-tool="select" data-i18n-title="tool.select"><svg viewBox="0 0 24 24"><path d="M5 3l13 9-6 1.5L9 20z"/></svg></button>
        <button class="tool" data-tool="wand" data-i18n-title="tool.wand"><svg viewBox="0 0 24 24"><path d="M4 20L15 9M14 4v3M19 9h-3M17.5 5.5l-2 2M10 4.5l1 1.5M19.5 13l-1.5-1"/></svg></button>
        <button class="tool" data-tool="brush" data-i18n-title="tool.brush"><svg viewBox="0 0 24 24"><path d="M19 4l-8.5 8.5M9 13.5c-2.5 0-4 1.6-4 4 0 1-.6 1.8-1.5 2.5 4 .5 7.5-1 7.5-4.5z"/></svg></button>
        <button class="tool" data-tool="lasso" data-i18n-title="tool.lasso"><svg viewBox="0 0 24 24"><path d="M7 15.5C4.6 14.3 3 12.4 3 10.2 3 6.2 7 3 12 3s9 3.2 9 7.2-4 7.3-9 7.3c-1 0-2-.1-2.9-.4M8 15a2 2 0 1 0 0 4c1 0 1.5 1 1 2"/></svg></button>
        <button class="tool" data-tool="erase" data-i18n-title="tool.erase"><svg viewBox="0 0 24 24"><path d="M8 20h12M5.5 13.5l7-7a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 18H8z"/></svg></button>
        <button class="tool" data-tool="exclude" data-i18n-title="tool.exclude"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12l8-8M4 20L20 4M12 20l8-8"/></svg></button>
        <button class="tool" data-tool="include" data-i18n-title="tool.include"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 3"/><path d="M9 12h6M12 9v6"/></svg></button>
        <button class="tool" data-tool="pan" data-i18n-title="tool.pan"><svg viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6.5a1.5 1.5 0 0 1 3 0v7c0 4-2.5 6.5-6 6.5-2.4 0-3.8-1-5-3l-2-3.5a1.5 1.5 0 0 1 2.5-1.6L8 13"/></svg></button>
        <span class="sep"></span>
        <label class="opt" id="optShape" hidden><span data-i18n="tool.shape"></span><select id="exShape"><option value="brush" data-i18n="tool.shapeBrush"></option><option value="rect" data-i18n="tool.shapeRect"></option></select></label>
        <label class="opt" id="optSize"><span data-i18n="tool.size"></span><input type="range" id="brushSize" min="1" max="120"><output id="brushOut"></output></label>
        <label class="opt" id="optTol"><span data-i18n="tool.tol"></span><input type="range" id="wandTol" min="2" max="120"><output id="tolOut"></output></label>
        <span class="grow" style="flex:1"></span>
        <button class="btn small ghost" id="undoBtn" data-i18n-title="undo" disabled>↶</button>
        <label class="opt"><input type="checkbox" id="showOrig"><span data-i18n="view.orig"></span></label>
        <label class="opt"><span data-i18n="view.overlay"></span><input type="range" id="ovAlpha" min="0" max="100" style="width:70px"></label>
        <button class="btn small" id="zoomOut">−</button><span class="zoom" id="zoomLbl">100%</span><button class="btn small" id="zoomIn">+</button>
        <button class="btn small" id="zoomFit" data-i18n="view.fit"></button>
      </div>
      <div class="viewport" id="viewport">
        <canvas id="view"></canvas>
        <canvas id="profile"></canvas>
        <div class="empty" id="empty"><div>
          <h2 data-i18n="empty.title"></h2>
          <p data-i18n="empty.body"></p>
          <div class="row" style="justify-content:center">
            <label class="btn primary file"><span data-i18n="sec.add"></span><input type="file" id="addImg2" accept="image/*,.tif,.tiff" multiple></label>
            <button class="btn" id="loadExample" data-i18n="empty.example"></button>
          </div>
        </div></div>
        <div class="busy" id="busy" hidden data-i18n="busy"></div>
      </div>
      <div class="statusbar"><span id="stDepth"></span><span id="stPx"></span><span id="stObj"></span></div>
    </section>

    <aside class="side right">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="classes" aria-selected="true" data-i18n="tab.classes"></button>
        <button role="tab" data-tab="object" aria-selected="false" data-i18n="tab.object"></button>
        <button role="tab" data-tab="learn" aria-selected="false" data-i18n="tab.learn"></button>
        <button role="tab" data-tab="results" aria-selected="false" data-i18n="tab.results"></button>
      </div>
      <div class="pane" data-pane="classes">
        <ul class="clist" id="classList"></ul>
        <div class="row"><button class="btn small" id="addClass" data-i18n="cls.add"></button></div>
        <p class="note" data-i18n="cls.hint"></p>
      </div>
      <div class="pane" data-pane="object" hidden>
        <div id="objInfo"></div>
        <div class="row" id="selTools"></div>
        <div class="row"><button class="btn small" id="nextReview" data-i18n="obj.next"></button></div>
        <label class="chk"><input type="checkbox" id="autoNext"><span data-i18n="obj.autoNext"></span></label>
      </div>
      <div class="pane" data-pane="learn" hidden>
        <p class="note" data-i18n="l.intro"></p>
        <button class="btn primary small" id="mlOpen" data-i18n="ml.open"></button>
        <div id="clfScopeBox" class="clfscope"></div>
        <div id="learnStats"></div>
        <div class="slider"><span data-i18n="l.thr"></span><output id="thrOut"></output><input type="range" id="predThr" min="0.3" max="0.99" step="0.01"></div>
        <div class="slider"><span data-i18n="l.novelty"></span><output id="novOut"></output><input type="range" id="novelty" min="1" max="8" step="0.5"></div>
        <div class="row"><button class="btn primary small" id="acceptPred" data-i18n="l.accept"></button></div>
        <div class="row"><button class="btn small" id="exportModel" data-i18n="l.export"></button>
          <label class="btn small file"><span data-i18n="l.import"></span><input type="file" id="importModel" accept=".json,application/json"></label>
          <button class="btn small ghost" id="clearLib" data-i18n="l.clearLib"></button></div>
      </div>
      <div class="pane" data-pane="results" hidden>
        <div id="resSummary"></div>
        <p class="note" data-i18n="r.manualNote"></p>
        <div id="resTable"></div>
        <div class="exp">
          <button class="btn small" id="expCSV" data-i18n="r.csv"></button>
          <button class="btn small" id="expObjects" data-i18n="r.objectsCsv"></button>
          <button class="btn small" id="expMask" data-i18n="r.mask"></button>
          <button class="btn small" id="expPalette" data-i18n="r.palette"></button>
        </div>
      </div>
    </aside>

    <aside class="side left" id="logPanel">
      <div class="body" style="padding:14px;display:grid;gap:12px">
        <label class="f"><span data-i18n="log.axis"></span><select id="logAxis"><option value="depth" data-i18n="log.depth"></option><option value="age" data-i18n="log.age"></option></select></label>
        <div class="f"><span data-i18n="log.window"></span>
          <div class="grid2"><label class="f"><span data-i18n="log.from"></span><input type="number" id="logFrom" step="any"></label><label class="f"><span data-i18n="log.to"></span><input type="number" id="logTo" step="any"></label></div>
          <button class="btn small" id="logAll" data-i18n="log.all"></button>
        </div>
        <div class="slider"><span data-i18n="log.height"></span><output id="logHeightOut"></output><input type="range" id="logHeight" min="300" max="3000" step="50"></div>
        <div class="f" id="logTracks"><span data-i18n="log.tracks"></span>
          <label class="chk"><input type="checkbox" data-track="image"><span data-i18n="log.image"></span></label>
          <label class="chk"><input type="checkbox" data-track="total"><span data-i18n="log.total"></span></label>
          <label class="chk"><input type="checkbox" data-track="species"><span data-i18n="log.species"></span></label>
          <label class="chk"><input type="checkbox" data-track="BI"><span>BI</span></label>
          <label class="chk"><input type="checkbox" data-track="ii"><span>ii</span></label>
          <label class="chk"><input type="checkbox" data-track="manual"><span data-i18n="log.manual"></span></label>
        </div>
        <div class="grid2"><label class="f"><span data-i18n="log.imgMode"></span><select id="logImgMode"><option value="enh" data-i18n="log.enh"></option><option value="orig" data-i18n="log.orig"></option></select></label>
          <label class="chk" style="align-self:end"><input type="checkbox" id="logOverlay"><span data-i18n="log.overlay"></span></label></div>
        <div class="f"><span data-i18n="log.records"></span>
          <div id="recList" style="display:grid;gap:6px"></div>
          <label class="btn small file"><span data-i18n="log.addRec"></span><input type="file" id="recFile" accept=".csv,.txt,.tsv,.dat,.xlsx,.xls,.ods,text/csv,text/plain"></label>
          <p class="note" data-i18n="log.recNote"></p>
        </div>
