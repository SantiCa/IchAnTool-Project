# Builds the SedCoreTool desktop program for Windows, macOS and Linux and publishes it as a GitHub Release.
# Runs when a delivery tag (V0.1, V0.2…) is pushed (tools/release.sh does it), or by hand from the Actions tab
# (artifacts by default, or an unpublished draft when draft_release is checked). V0.40: no `release` trigger (a release made on the web also pushes its tag,
# which ran the build twice).
# The owner's private data is git-ignored, so it never reaches these builds.
name: Desktop builds

on:
  push:
    tags: ['V*']
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Prepare an unpublished release draft with installers and offline HTML (master only)'
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: npm test
      - run: pip install -e ".[dev]" && pytest -q
      - run: python tools/sync_version.py --check

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Prepare Electron smoke-test data
        run: npm run prepare-web -- --with-examples
      - run: npm i --no-save --package-lock=false puppeteer-core@23
        working-directory: .
      - run: xvfb-run -a node tests/e2e/desktop.mjs
        working-directory: .
        if: runner.os == 'Linux'
      - run: node tests/e2e/desktop.mjs
        working-directory: .
        if: runner.os != 'Linux'
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds (no paid certificates)
      - name: Check packaged application data
        run: node scripts/check-package.js
      - uses: actions/upload-artifact@v7
        with:
          name: sedcoretool-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.draft_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job publishes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Check delivery and draft target
        id: version
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python tools/sync_version.py --check
          DELIVERY=$(python -c "import sys; sys.path.insert(0, 'tools'); from build_standalone import delivery; print(delivery())")
          echo "delivery=$DELIVERY" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_EVENT" = workflow_dispatch ]; then
            if [ -n "$(git ls-remote --tags origin "refs/tags/$DELIVERY")" ]; then
              echo "Tag already exists; refusing to change an existing release into a draft."
              exit 1
            fi
          elif [ "$RELEASE_REF" != "$DELIVERY" ]; then
            echo "Tag and DELIVERY differ."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with: { path: out, pattern: 'sedcoretool-*-latest', merge-multiple: true }
      - run: python tools/prepare_release.py out
      - uses: actions/upload-artifact@v7
        with:
          name: sedcoretool-release-bundle
          path: out/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          name: SedCoreTool ${{ steps.version.outputs.delivery }}
          tag_name: ${{ steps.version.outputs.delivery }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: desktop/RELEASE_NOTES.md
          files: out/*
          fail_on_unmatched_files: true
          overwrite_files: false
